name: Cross Build and Package

on:
  push:
    tags:
      - 'v*'
  pull_request:
  # Dry run of the darwin packaging: builds the archive as an artifact, while
  # `build` and therefore `release` stay tag-only.
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise exec -- pre-commit run --all-files

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq fd-find ripgrep
      - uses: jdx/mise-action@v2
      - run: mise run test

  # Runners grant no Accessibility permission: the AX source is only compiled
  # here, the tests run against the simulated one.
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Provides LuaSkin.framework, whose headers the module compiles against.
      - name: Install Hammerspoon
        run: brew install --cask hammerspoon
      - name: Build universal library
        working-directory: macos/native
        run: make universal && lipo -info obj_universal/_dfzf.so
      - name: Test native core
        working-directory: macos/native
        run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: hs-dfzf
          path: macos/native/obj_universal/_dfzf.so

  build:
    # Gate the release on lint and tests: without this, build/release run in
    # parallel with them and tags get published despite a red job.
    needs: [pre-commit, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust target
        run: |
          rustup update
          rustup target add ${{ matrix.arch == 'amd64' && 'x86_64-unknown-linux-gnu' || 'aarch64-unknown-linux-gnu' }}

      - name: Add rust-src component
        if: matrix.arch == 'arm64'
        run: rustup component add rust-src

      - name: Set up cargo config for ARM64
        if: matrix.arch == 'arm64'
        run: |
          mkdir -p .cargo
          cat <<EOF > .cargo/config.toml
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Install build tools
        run: |
          sudo apt-get update
          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            sudo apt-get install -y gcc-multilib fakeroot dpkg-dev
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu fakeroot dpkg-dev
          fi

      - name: Build binary
        run: |
          cd dfzf-utils
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
             TARGET="aarch64-unknown-linux-gnu"
             RUSTFLAGS='-C target-feature=+crt-static' \
             cargo build --release --target=$TARGET
          else
             TARGET="x86_64-unknown-linux-gnu"
             RUSTFLAGS='-C target-feature=+crt-static' \
             cargo build --release --target=$TARGET
          fi

      - name: Prepare package directory
        run: |
          mkdir -p package/${{ matrix.arch }}/usr/local/bin
          find  dfzf-utils  -type f  -executable -name "dfzf-*" |xargs -I@ cp @ package/${{ matrix.arch }}/usr/local/bin/
          cp bin/* package/${{ matrix.arch }}/usr/local/bin/

      - name: Create .tar.gz
        run: |
          mkdir -p dist
          tar -czf dist/dfzf-${{ matrix.arch }}-${GITHUB_REF_NAME#v}.tar.gz -C package/${{ matrix.arch }} usr

      - name: Create .deb package
        run: |
          mkdir -p pkgroot/DEBIAN
          mkdir -p pkgroot/usr/local/bin

          cp -r package/${{ matrix.arch }}/usr/local/bin/* pkgroot/usr/local/bin/
          cat > pkgroot/DEBIAN/control <<EOF
          Package: dfzf
          Version: ${GITHUB_REF_NAME#v}
          Architecture: ${{ matrix.arch }}
          Maintainer: parisni <contact@parisni.com>
          Description: dfzf binaries
          EOF
          dpkg-deb --build pkgroot dist/dfzf-${{ matrix.arch }}-${GITHUB_REF_NAME#v}.deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dfzf-${{ matrix.arch }}
          path: dist/*

  build-darwin:
    needs: [pre-commit, test, native]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download hs._dfzf
        uses: actions/download-artifact@v4
        with:
          name: hs-dfzf
          path: macos/Dfzf.spoon/hs

      # Shell scripts only, no Rust daemon: the Hammerspoon spoon replaces it.
      # macos/bin is copied last so its scripts override the sway ones.
      - name: Create .tar.gz
        run: |
          test -f macos/Dfzf.spoon/hs/_dfzf.so
          version=${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF_TYPE == tag ]] || version="dev-${GITHUB_SHA::7}"
          mkdir -p package/bin dist
          cp bin/* package/bin/
          cp macos/bin/* package/bin/
          cp -R macos/Dfzf.spoon package/
          tar -czf "dist/dfzf-darwin-$version.tar.gz" -C package bin Dfzf.spoon
          tar -tzf "dist/dfzf-darwin-$version.tar.gz" | grep -qx 'Dfzf.spoon/hs/_dfzf.so'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dfzf-darwin
          path: dist/*

  release:
    needs: [build, build-darwin]
    runs-on: ubuntu-22.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # hs-dfzf already ships inside the darwin archive.
          pattern: dfzf-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/* # include all downloaded files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
